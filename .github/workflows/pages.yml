name: Hexo Pages
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false  # <-新增这一行！禁止拉取子模块
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: blog/package-lock.json
      - name: Install dependencies
        run: |
          cd blog
          npm install
      - name: Hexo generate
        run: |
          cd blog
          npx hexo generate
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: blog/public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

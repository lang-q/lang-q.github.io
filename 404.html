<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - 页面未找到</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            font-family: 'Arial', sans-serif;
        }
        
        .error-container {
            text-align: center;
            color: white;
        }
        
        .error-code {
            font-size: 8rem;
            font-weight: 700;
            text-shadow: 4px 4px 10px rgba(0,0,0,0.3);
            animation: pulse 2s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        .error-message {
            font-size: 1.5rem;
            margin: 2rem 0;
            opacity: 0.9;
        }
        
        .btn-custom {
            background: rgba(255,255,255,0.2);
            border: 2px solid white;
            color: white;
            padding: 12px 30px;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            margin: 5px;
        }
        
        .btn-custom:hover {
            background: white;
            color: #667eea;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .floating-icon {
            position: absolute;
            opacity: 0.1;
            animation: float 6s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-container">
            <!-- 装饰性图标 -->
            <i class="fas fa-ghost floating-icon" style="top: 20%; left: 10%; font-size: 3rem;"></i>
            <i class="fas fa-exclamation-triangle floating-icon" style="top: 30%; right: 15%; font-size: 2.5rem;"></i>
            <i class="fas fa-search floating-icon" style="bottom: 25%; left: 20%; font-size: 2rem;"></i>
            
            <!-- 主要内容 -->
            <div class="error-code">404</div>
            <div class="error-message">
                <h2 class="mb-3">哎呀！页面不见了</h2>
                <p class="lead">你访问的页面可能已被删除、名称已更改或暂时不可用。</p>
            </div>
            
            <!-- 操作按钮 -->
            <div class="mt-4">
                <a href="/" class="btn btn-custom">
                    <i class="fas fa-home me-2"></i>返回首页
                </a>
                <button class="btn btn-custom" onclick="history.back()">
                    <i class="fas fa-arrow-left me-2"></i>返回上一页
                </button>
            </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 添加一些交互效果
        document.addEventListener('DOMContentLoaded', function() {
            // 让图标随机漂浮
            const icons = document.querySelectorAll('.floating-icon');
            icons.forEach(icon => {
                icon.style.animationDelay = Math.random() * 2 + 's';
            });
            
            // 添加点击效果
            document.querySelectorAll('.btn-custom').forEach(btn => {
                btn.addEventListener('click', function() {
                    this.style.transform = 'scale(0.95)';
                    setTimeout(() => {
                        this.style.transform = 'scale(1)';
                    }, 150);
                });
            });
        });
    </script>
</body>
</html>
